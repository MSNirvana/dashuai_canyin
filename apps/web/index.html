<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- ★ meta description 会被搜索引擎、也会被审核时用的抓取工具读到，等同于页面正文。
         原来结尾交代了「会员与积分和**那个微信里的入口**是同一个账号」——
         等于在元信息里又说明了一次「服务在别处」。★ 改文案时记得连这里一起改：
         它不在任何 .tsx 里，前端代码全部 grep 干净了也照样漏。
         ⚠ 与下面备案号那条同一个道理：**本注释里不出现那三个字的字面量**，
           否则「产物里 grep 那三个字」这条判据会命中注释而自己给自己放水。
           （上一版就是这样：为了提醒别写，反而又写了一遍，判据照样红。） -->
    <meta name="description" content="大帅餐饮助手：为餐饮门店把菜品与门店卖点做成短视频的一站式内容生产工具。填一个菜名，当场出一条口播文案、分镜脚本和发布标题。" />
    <title>大帅餐饮助手 · 餐饮门店轻松拍</title>
  </head>
  <body>
    <!-- ★★ 备案号「静态回退」—— 合规硬要求，勿删 ★★
         React 页脚（src/components.tsx 的 .beian）里的备案号是 JS 渲染的，**不在 HTML 源码里**：
         直接取 HTML（爬虫、管局抓取、`curl`）看不到，旧静态页（deploy/site/index.html）的
         全部意义就是解决这件事。所以这里放一份静态副本。
         React 18 的 createRoot().render() 会清空 #root 原有子节点 ⇒ 浏览器里只显示页脚那一个，
         不会出现两个；JS 没加载出来时这一行仍在。
         ⚠ 备案号必须与备案系统**逐字**一致（末位的网站序号不能省），链接必须指向工信部备案官网首页。
         ⚠ 本注释里**刻意不写备案号字面量** —— 否则下方 grep 判据会命中注释而「自己给自己放水」。 -->
    <div id="root">
      <footer style="padding: 26px 20px 34px; font-size: 15px; line-height: 1.9; color: #4a4f57;">
        <div>© 2026 廊坊大帅餐饮管理有限公司</div>
        <div>
          <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" style="color: #4a4f57;">冀ICP备2023045927号-2</a>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
