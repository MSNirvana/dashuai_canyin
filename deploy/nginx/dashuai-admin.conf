# ═══════════════════════════════════════════════════════════════
# Nginx 站点：运营后台（apps/admin 打包出来的静态站）
# 落地位置：/etc/nginx/conf.d/dashuai-admin.conf
# 后端 admin 接口挂的是同域 /admin/api/v1，所以这里一起反代，避免再配一个域名
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name admin.REPLACE_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.REPLACE_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/admin.REPLACE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.REPLACE_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;

    access_log /var/log/nginx/dashuai-admin.access.log;
    error_log  /var/log/nginx/dashuai-admin.error.log;

    # 后台静态站（vite build 产物）
    root  /opt/dashuai/apps/admin/dist;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后台接口
    location /admin/api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 静态资源缓存
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
