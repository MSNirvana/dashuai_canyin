# ═══════════════════════════════════════════════════════════════
# Nginx 站点：运营后台（apps/admin 打包出来的静态站）
# 落地位置：/etc/nginx/conf.d/dashuai-admin.conf
# 后端 admin 接口挂的是同域 /admin/api/v1，所以这里一起反代，避免再配一个域名
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name admin.REPLACE_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.REPLACE_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/admin.REPLACE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.REPLACE_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;

    access_log /var/log/nginx/dashuai-admin.access.log;
    error_log  /var/log/nginx/dashuai-admin.error.log;

    # 后台静态站（vite build 产物）
    root  /opt/dashuai/apps/admin/dist;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后台接口
    location /admin/api/v1/ {
        # 轮播图上传走这里。★ 少了这行会踩一个**本地测不出来**的坑：
        # nginx 的 client_max_body_size 默认只有 1MB，超了直接 413 并返回 nginx 自己的
        # HTML 错误页（不是后端的 JSON 信封），而本地开发是 vite 直连 3000、不过 nginx，
        # 怎么传都是好的。另外两个 conf（api / dev-ip）早就设了 20m，只有这个文件漏了。
        #
        # 值取 20m 而不是刚好 5m（后端的单图上限）：让超标的图**穿过 nginx** 到达后端，
        # 由后端回一句 JSON「图片不能超过 5MB」；卡在 nginx 的话运营只能看到一句英文
        # 「Request failed with status code 413」。
        #
        # ── 教学中心视频上传（2026-09-17）──────────────────────────────────────
        # 同一个 location 还挂着 POST /admin/api/v1/tutorials/upload，视频上限 100MB
        # ⇒ 20m 会把所有稍长的课程都挡在门外（而且**本地测不出来**：vite 直连 3000 不过 nginx）。
        # 取 110m = 视频上限 100m + 表单开销。超出 110m 的由 nginx 拒（返回 413 页面），
        # 100~110m 之间的会穿到后端拿到 JSON 错误文案；前端在选文件时就先挡一道（见 Tutorials.tsx）。
        # ⚠ 改这里时三处必须同值：server/src/services/tutorial.service.ts 的
        #   MAX_TUTORIAL_VIDEO_BYTES、apps/admin/src/pages/Tutorials.tsx 的预校验、本行。
        client_max_body_size 110m;

        # 100MB 的 body 不必先整份缓冲到 nginx 磁盘再转给后端（省一次全量落盘）
        proxy_request_buffering off;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态资源缓存
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
