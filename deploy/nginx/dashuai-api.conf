# ═══════════════════════════════════════════════════════════════
# Nginx 站点：API 域名（小程序 request / uploadFile 走这里）
# 落地位置：/etc/nginx/conf.d/dashuai-api.conf
# 替换：api.REPLACE_DOMAIN → 你的真实 API 域名
# 证书：用 certbot 签发后会自动生成 /etc/letsencrypt/live/<域名>/ 下的文件
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name api.REPLACE_DOMAIN;

    # certbot http-01 校验目录，必须在 301 之前
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.REPLACE_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/api.REPLACE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.REPLACE_DOMAIN/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.REPLACE_DOMAIN/chain.pem;

    # 微信小程序要求 TLS 1.2 及以上
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 视频素材走 COS 直传，这里不需要太大；留 20m 兜底
    client_max_body_size 20m;

    # 不把后端版本号暴露给外部
    server_tokens off;

    access_log /var/log/nginx/dashuai-api.access.log;
    error_log  /var/log/nginx/dashuai-api.error.log;

    # 健康检查
    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # 微信支付回调 /api/v1/pay/notify 依赖原始 body 字节做验签，
        # 必须关闭请求缓冲与响应缓冲，避免 Nginx 改写分块传输
        proxy_request_buffering off;
        proxy_buffering         off;

        # AI 生成与合成提交都可能超过默认 60s
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
