# ═══════════════════════════════════════════════════════════════
# Nginx 站点：主域名官网首页（**备案号悬挂页**）
#   落地位置：/etc/nginx/conf.d/dashuai-web.conf
#   替换：REPLACE_DOMAIN → 你的主域名（本项目 = dspcz.top）
#   部署：  scp 到 /tmp 后 sudo cp 到上面路径 && sudo nginx -t && sudo nginx -s reload
#
# 为什么必须存在这个站点
# ──────────────────────
# 管局对 ICP 备案的要求是「**在网站首页底部**悬挂备案号并链接至工信部备案官网首页，
# 否则将被管局责令更改」。腾讯云备案控制台也把它列为「必须」项。
# 而本项目此前**根域没有任何站点** —— `dspcz.top` 命中的是那个唯一的
# `default_server`（`00-dashuai-dev-ip.conf`），显示的是**运营后台登录页**。
# 那既不是可用的首页、也满足不了悬挂要求，还等于把后台挂在公网根域上。
#
# 本文件同时做三件事：
#   1) 给 `REPLACE_DOMAIN` / `www.REPLACE_DOMAIN` 一个真实首页（`/var/www/dashuai-web`）
#      ⇒ 备案号悬挂在首页底部（见 deploy/site/index.html）
#   2) 接管 `default_server`：**未知 Host / 直连 IP 一律落到这张首页**
#      ⇒ 运营后台不再通过根域或裸 IP 暴露（配合删除 `00-dashuai-dev-ip.conf`）
#   3) 提供 `/.well-known/acme-challenge/` ⇒ 主域名也能被签进同一张 SAN 证书
#
# ★ 关于 `default_server`（全站只能有一个）
# ─────────────────────────────────────
# `00-dashuai-dev-ip.conf` 已于 2026-09-21 备案通过后**按它自己头部的说明删除**
# （它会让 API 与后台经公网 IP 裸奔，无 HTTPS，token/手机号明文过网）。
# 本文件承接 `default_server` 这个角色，**且必须保持唯一**：
# 再加第二个 `listen 80 default_server` ⇒ nginx 直接起不来（`a duplicate default server`）。
# 下面 443 段的 `default_server` 同理：全站 443 上也只应有这一个（它可以让「未知 SNI」
# 落到首页，而不是落到 admin 站点 —— conf.d 里按字典序取第一个 443 做隐式默认）。
#
# 证书：与 api / admin **共用同一张 SAN 证书**
# ─────────────────────────────────────
# 一张 Let's Encrypt 证书同时覆盖 api + admin + 主域 + www（四个都在 SAN 里），
# 所以这里指向的是 `live/<主域名>/` —— 本项目的主域名是 `api.dspcz.top`（certbot 按
# 第一个 `-d` 建 lineage）。**不是** `live/REPLACE_DOMAIN/`。照直觉配会找不到文件。
# 扩展证书的命令见 deploy/README.md 的「HTTPS 实况与自动续期」一节。
# ═══════════════════════════════════════════════════════════════

server {
    # ★ 全站唯一的 80 default_server：未知 Host、直连 IP 都进来
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name REPLACE_DOMAIN www.REPLACE_DOMAIN _;

    # certbot http-01 校验目录，必须在 301 之前
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # www 与 http 一并收敛到主域的 https（备案域名是主域，统一口径）
    location / {
        return 301 https://REPLACE_DOMAIN$request_uri;
    }
}

server {
    # ★ 443 上的 default_server：未知 SNI 也落到首页，而不是 admin 站点
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name REPLACE_DOMAIN www.REPLACE_DOMAIN;

    # 与 api / admin 共用同一张 SAN 证书 ⇒ 指向 live/<主域名>/（本项目 api.dspcz.top）
    ssl_certificate         /etc/letsencrypt/live/api.REPLACE_DOMAIN/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/api.REPLACE_DOMAIN/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.REPLACE_DOMAIN/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    access_log /var/log/nginx/dashuai-web.access.log;
    error_log  /var/log/nginx/dashuai-web.error.log;

    # 纯静态首页，不需要任何 body
    client_max_body_size 1m;

    root  /var/www/dashuai-web;
    index index.html;

    # 首页文件缺失时给一句人话，而不是 nginx 的白底 403/404
    # （备案期间运维只关心「备案号能不能看到」，403 会让人误判成权限问题）
    location = / {
        try_files /index.html =503;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
