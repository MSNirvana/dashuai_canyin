# ═══════════════════════════════════════════════════════════════
# Nginx 站点：IP 直连（**仅开发测试期使用**）
#   落地位置：/etc/nginx/conf.d/00-dashuai-dev-ip.conf
#   部署：  scp 到 /tmp 后 sudo cp 到上面路径 && sudo nginx -t && sudo nginx -s reload
#   撤销：  sudo rm /etc/nginx/conf.d/00-dashuai-dev-ip.conf && sudo nginx -s reload
#
# 为什么需要它
# ────────────
# 腾讯云接入层按 **Host 头** 拦截「本厂商侧无有效备案记录」的域名：
#   Host: api.dspcz.top  → 302 到 webblock（100% 复现，HTTPS 则按 SNI 直接 RST）
# 但 **Host 不是那个域名时**（例如直连 IP，Host 就是 IP），请求能正常到达本机
# nginx —— 实测外网 `curl -H 'Host: <IP>' http://<IP>/` 拿到的是本机 nginx 生成的
# 错误页，与本机 `curl 127.0.0.1` 逐字节一致，可证未被云端拦截。
#
# ⛔ 已于 2026-09-21 下线（备案通过后按其自身说明删除）
# ────────────
# 它会让 API 与运营后台通过公网 IP 裸奔（**无 HTTPS**，登录 token / 手机号明文过网）。
# 备案一通就切真域名 + https，这条缝隙没有保留价值。
#
# **实际处置**：2026-09-21 备案通过 + HTTPS 上线后，已从服务器删除
#   `/etc/nginx/conf.d/00-dashuai-dev-ip.conf`
#   （备份在 `/home/ubuntu/dashuai-deploy-backups/nginx-20260921-180746-web/`），
# 其 `default_server` 角色由新增的 `dashuai-web.conf` 接管
#   （未知 Host / 直连 IP 一律落到主域首页，而不是后台登录页）。
# 本文件**保留在仓库里**只为留存「腾讯云按 Host 头拦截」这段推理与复现步骤；
# ★ 不要再把它拷回服务器 —— 那会让后台重新经公网 IP 裸奔。
#
# 注意：显式 default_server 不依赖文件名字典序，加 `00-` 前缀只为可读性。
#       admin / api 两个站点都是裸 `listen 80`，全站只有一个 default_server，合法。
#       ⇒ ★ 本文件是**唯一的** default_server，别再加第二个 `listen 80 default_server`
#         （nginx 会直接起不来：`a duplicate default server`）。
#
# ── 2026-09-18 改版：从「全部反代给 API」改成「API + 运营后台静态站」────────────
# 需求：无备案期也要能用**公网 IP** 把运营后台给外地的人测（浏览器直开，不碰微信）。
#
# 为什么后台挂在**根路径**而不是 `/admin/`：
#   `apps/admin/vite.config.ts` 没有设 `base`（默认 `/`）⇒ 产物 `index.html` 里引用的是
#   **绝对路径** `/assets/index-*.js`。若把静态站挂在 `/admin/` 下，浏览器会去请求
#   `/assets/…`，它匹配不到 `/admin/` 而落到兜底 location ⇒ **白屏**（且控制台只报 404）。
#   改 `base` 会连带影响本机 dev（现在是 `http://127.0.0.1:5173/`），不划算 ⇒ 挂根路径。
#
# 挂根路径是安全的：服务端**所有**路由都在 `/api/v1` 或 `/admin/api/v1` 下
#   （`server/src/index.ts:57-93` 逐个核对过），根路径只有 `/healthz`，
#   所以「其余全部交给 SPA」不会吃掉任何一个接口。
#
# ⚠ 顺序无关但**前缀长度有关**：`/admin/api/v1/` 与 `/api/v1/` 都比 `/` 长，
#   nginx 按最长前缀选 location ⇒ 接口不会被 SPA 的 `try_files` 吃掉。
#
# ⚠ 与 `dashuai-admin.conf`（https 版）的关系：**别同时启用**
#   那个文件是给备案后 `admin.<域名>` 用的（443 + certbot 证书），
#   当前无证书无域名，启用它会让 80 端口的隐式 default server 变成它、IP 直连一律 500。
#   现在只启用本文件；备案后 `sudo rm` 本文件再上那个。
# ═══════════════════════════════════════════════════════════════

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ★ 原来是 20m。现在后台有两条大文件通道，20m 会把它们挡在门外：
    #   - 教学中心视频上传：100MB（server/src/services/tutorial.service.ts::MAX_TUTORIAL_VIDEO_BYTES）
    #   - 精品交付成片上传：100MB（server/src/services/premium-delivery.service.ts::MAX_DELIVER_VIDEO_BYTES）
    #   取 110m = 100m + 表单开销。⚠ 三处必须同值：服务端常量、前端选文件时的预校验、本行。
    #   卡在 nginx 的话运营只能看到 nginx 自己的英文 413 页面（不是后端 JSON 信封），
    #   而且**本地开发测不出来**（vite 直连 3000、不过 nginx）。
    client_max_body_size 110m;

    server_tokens off;

    # 运营后台静态站（vite build 产物）。放在 server 级，各 location 继承。
    root  /opt/dashuai/apps/admin/dist;
    index index.html;

    # 健康检查（与 dashuai-api.conf 保持一致）
    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }

    # ── 后台接口 ────────────────────────────────────────────────────────
    # 单独列出来是因为 /admin/api/v1/ 也以 /admin/ 开头，虽然本文件没有
    # `/admin/` 这个 location，但**将来有人加**（例如想给个别名路径）就会立刻踩到
    # 「接口被静态文件 try_files 吃掉」。显式写出来 = 把这条约束钉在配置里。
    location /admin/api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # 100MB 的 body 不必先整份落到 nginx 磁盘再转发
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 小程序 / 其它 API ───────────────────────────────────────────────
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 透传 Host=IP。服务端只有 media 绝对地址会用到它
        # （`${req.protocol}://${req.get('host')}/api/v1/media`），
        # 于是服务端自动生成的图片/视频地址也会指向 IP，与小程序 base 自洽。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # 微信支付回调依赖原始 body 字节验签；AI 生成 / 合成可能超 60s。
        # 与 dashuai-api.conf 保持完全一致，避免两套行为不一致。
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── 运营后台 SPA ────────────────────────────────────────────────────
    # 放最后：它是「除上面以外的一切」。SPA 的前端路由（/premium-orders、/render-tasks…）
    # 服务端没有对应文件 ⇒ 必须回退到 index.html，否则刷新任意子路由都是 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（vite 产物带内容哈希，可以放心 immutable）
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        # ⚠ 必须带 try_files 的兜底：否则一个不存在的 .js 会返回 nginx 的 HTML 404 页，
        #   而浏览器期望 JS ⇒ 报 `Unexpected token '<'`，看不出是「文件没传上去」。
        try_files $uri =404;
    }
}
