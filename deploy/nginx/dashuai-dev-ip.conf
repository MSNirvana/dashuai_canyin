# ═══════════════════════════════════════════════════════════════
# Nginx 站点：IP 直连（**仅开发测试期使用**）
#   落地位置：/etc/nginx/conf.d/00-dashuai-dev-ip.conf
#   部署：  scp 到 /tmp 后 sudo cp 到上面路径 && sudo nginx -s reload
#   撤销：  sudo rm /etc/nginx/conf.d/00-dashuai-dev-ip.conf && sudo nginx -s reload
#
# 为什么需要它
# ────────────
# 腾讯云接入层按 **Host 头** 拦截「本厂商侧无有效备案记录」的域名：
#   Host: api.dspcz.top  → 302 到 webblock（100% 复现，HTTPS 则按 SNI 直接 RST）
# 但 **Host 不是那个域名时**（例如直连 IP，Host 就是 IP），请求能正常到达本机
# nginx —— 实测外网 `curl -H 'Host: <IP>' http://<IP>/` 拿到的是本机 nginx 生成的
# 170 字节错误页，与本机 `curl 127.0.0.1` 逐字节一致，可证未被云端拦截。
#
# 可是这请求会被 dashuai-admin.conf 接走：它因为文件名字典序在前，成了 80 端口
# 的**隐式 default server**；而它的 root（/opt/dashuai/apps/admin/dist）尚未构建，
# `try_files` 找不到文件 → 一律 500。于是 IP 直连表现为「能连上但 500」。
#
# 本文件用**显式 default_server** 把「非域名 Host」的请求接给 API 进程，
# 让小程序在开发者工具 / 开发版真机上能连测试服务，**完全绕开备案**。
#
# ⚠ 备案通过后本文件应当删除
# ────────────
# 它会让 API 通过公网 IP 裸奔（无 HTTPS、无域名）。备案一通就用真域名，
# 这条缝隙没有保留价值。健康检查除外，见下面 access_log off。
#
# 注意：显式 default_server 不依赖文件名字典序，加 `00-` 前缀只为可读性。
#       admin / api 两个站点都是裸 `listen 80`，全站只有一个 default_server，合法。
# ═══════════════════════════════════════════════════════════════

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;
    server_tokens off;

    # 健康检查（与 dashuai-api.conf 保持一致）
    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 透传 Host=IP。服务端只有 media 绝对地址会用到它
        # （`${req.protocol}://${req.get('host')}/api/v1/media`），
        # 于是服务端自动生成的图片/视频地址也会指向 IP，与小程序 base 自洽。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # 微信支付回调依赖原始 body 字节验签；AI 生成 / 合成可能超 60s。
        # 与 dashuai-api.conf 保持完全一致，避免两套行为不一致。
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
